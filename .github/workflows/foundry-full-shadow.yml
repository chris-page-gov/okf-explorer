name: Evaluation Foundry nightly full shadow

on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up locked Python toolchain
        uses: ./.github/actions/setup-locked-python
      - name: Reject all reconstructed late-finding classes
        run: >-
          uv run --locked python scripts/check_heritage_adversarial.py
          --output "$RUNNER_TEMP/adversarial-results.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-adversarial-gate-results
          path: ${{ runner.temp }}/adversarial-results.json

  browser-three-engine:
    needs: adversarial-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/okf-explorer/pnpm-lock.yaml
      - name: Set up locked Python toolchain
        uses: ./.github/actions/setup-locked-python
      - working-directory: apps/okf-explorer
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for the browser-backed contract test
        working-directory: apps/okf-explorer
        run: pnpm exec playwright install --with-deps chromium
      - name: Materialise SvelteKit TypeScript configuration
        working-directory: apps/okf-explorer
        run: pnpm exec svelte-kit sync
      - name: Validate and deterministically build Explorer
        working-directory: apps/okf-explorer
        run: |
          pnpm check
          pnpm test
          pnpm sbom:check
          pnpm build:determinism
      - name: Assemble Site for rendered Foundry pages
        run: uv run --locked python scripts/build_site.py
      - name: Install Firefox and WebKit browser dependencies
        working-directory: apps/okf-explorer
        run: pnpm exec playwright install --with-deps firefox webkit
      - name: Run full Chrome, Firefox and WebKit terminal assurance
        working-directory: apps/okf-explorer
        run: pnpm test:e2e:terminal

  foundry-full-family:
    needs: adversarial-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up locked Python toolchain
        uses: ./.github/actions/setup-locked-python
      - name: Run full Foundry and candidate checks
        run: |
          uv run --locked python scripts/check_evaluation_foundry.py
          uv run --locked python scripts/retarget_heritage_source_snapshots.py --check
          uv run --locked python scripts/build_heritage_evaluation.py --check --fixture all
          uv run --locked python scripts/export_publication_unit.py --descriptor publication-units/heritage-coventry-warwickshire/publication-unit.json --check
          uv run --locked python -m unittest discover -s tests
