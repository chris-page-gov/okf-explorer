name: Audit the deployed beginner guide

on:
  workflow_dispatch:
    inputs:
      publication_commit:
        description: Full Git commit of the already deployed Site
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PLAYWRIGHT_BASE_URL: https://chris-page-gov.github.io/okf-explorer/
      OKF_BEGINNER_RELEASE_AUDIT: '1'
      EXPECTED_PUBLICATION: ${{ inputs.publication_commit }}
    steps:
      - name: Verify the requested live commit
        run: |
          [[ "$EXPECTED_PUBLICATION" =~ ^[0-9a-f]{40}$ ]]
          node --input-type=module - <<'NODE'
          const url = new URL('okf-publication-identity.json', process.env.PLAYWRIGHT_BASE_URL);
          url.searchParams.set('verify', process.env.EXPECTED_PUBLICATION);
          const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(8000) });
          if (!response.ok || (await response.json()).commit !== process.env.EXPECTED_PUBLICATION) {
            throw new Error('The live Site differs from the requested commit.');
          }
          NODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.publication_commit }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: pnpm
          cache-dependency-path: apps/okf-explorer/pnpm-lock.yaml
      - working-directory: apps/okf-explorer
        run: pnpm install --frozen-lockfile
      - name: Select Ubuntu HTTPS archives for browser packages
        timeout-minutes: 1
        run: |
          printf '%s\n' \
            'https://archive.ubuntu.com/ubuntu/' \
            'https://security.ubuntu.com/ubuntu/' \
            | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
      - name: Install Firefox and WebKit for the deployed guide audit
        working-directory: apps/okf-explorer
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps firefox webkit
      - name: Audit every chapter and confirm the live commit
        working-directory: apps/okf-explorer
        timeout-minutes: 3
        run: |
          pnpm exec playwright test --config=playwright.foundry.config.ts \
            tests/foundry/beginner-guide-fragments.spec.ts \
            --project=chrome --project=firefox --project=webkit --workers=3 --reporter=json \
            > "$RUNNER_TEMP/guide-browser-report.json"
          node --input-type=module - <<'NODE'
          const url = new URL('okf-publication-identity.json', process.env.PLAYWRIGHT_BASE_URL);
          url.searchParams.set('verify', process.env.EXPECTED_PUBLICATION);
          const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(8000) });
          if (!response.ok || (await response.json()).commit !== process.env.EXPECTED_PUBLICATION) {
            throw new Error('The live Site differs from the requested commit.');
          }
          NODE
      - name: Retain the exact browser observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: beginner-guide-live-browser-report
          path: ${{ runner.temp }}/guide-browser-report.json
          if-no-files-found: ignore
