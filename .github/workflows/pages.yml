name: Publish GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/okf-explorer/pnpm-lock.yaml

      - name: Install OKF Explorer dependencies
        working-directory: apps/okf-explorer
        run: pnpm install --frozen-lockfile

      - name: Validate Svelte OKF Explorer
        working-directory: apps/okf-explorer
        run: pnpm check

      - name: Prove deterministic Svelte OKF Explorer build
        working-directory: apps/okf-explorer
        run: pnpm build:determinism

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install semantic OKF dependencies
        run: python3 -m pip install -r requirements-okf.txt

      - name: Validate Evaluation Foundry fixtures
        run: python3 scripts/check_evaluation_foundry.py

      - name: Validate generated heritage evaluation corpora
        run: |
          python3 scripts/build_heritage_evaluation.py --check
          python3 scripts/build_heritage_evaluation.py --check \
            --snapshot evaluation-foundry/fixtures/heritage-warwickshire/tiny/source-snapshot.json \
            --output evaluation/heritage/tiny
          python3 scripts/build_heritage_evaluation.py --check \
            --snapshot evaluation-foundry/fixtures/heritage-warwickshire/synthetic/source-snapshot.json \
            --output evaluation/heritage/synthetic

      - name: Validate YAML-LD registry and constraint ledger
        run: |
          python3 scripts/build_okf_registry.py --check
          python3 scripts/check_source_constraints.py

      - name: Validate OKF bundle
        run: python3 scripts/check_okf.py

      - name: Validate OKF Explorer bundle
        run: python3 scripts/build_okf_bundle.py --check

      - name: Validate legislation corpus
        run: python3 scripts/check_legislation_okf.py

      - name: Build static site
        run: python3 scripts/build_site.py

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
