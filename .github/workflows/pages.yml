name: Publish GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  impact:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      foundry: ${{ steps.plan.outputs.foundry || 'true' }}
      builder_fixtures: ${{ steps.plan.outputs.builder_fixtures || '["tiny","faithful","synthetic"]' }}
      builder_planes: ${{ steps.plan.outputs.builder_planes || '["control","data","search","semantic","presentation"]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - name: Set up locked Python toolchain
        uses: ./.github/actions/setup-locked-python
      - name: Plan push impact or fail closed for manual publication
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "foundry=true" >> "$GITHUB_OUTPUT"
            echo 'builder_fixtures=["tiny","faithful","synthetic"]' >> "$GITHUB_OUTPUT"
            echo 'builder_planes=["control","data","search","semantic","presentation"]' >> "$GITHUB_OUTPUT"
          else
            uv run --locked python scripts/plan_evaluation_foundry_impact.py --changed-from HEAD^ --output impact-plan.json --github-output "$GITHUB_OUTPUT" --explain
          fi

  adversarial-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up locked Python toolchain
        uses: ./.github/actions/setup-locked-python
      - name: Reject all reconstructed late-finding classes
        run: >-
          uv run --locked python scripts/check_heritage_adversarial.py
          --output "$RUNNER_TEMP/adversarial-results.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pages-adversarial-gate-results
          path: ${{ runner.temp }}/adversarial-results.json

  app:
    needs: [impact, adversarial-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/okf-explorer/pnpm-lock.yaml
      - working-directory: apps/okf-explorer
        run: pnpm install --frozen-lockfile
      - name: Validate Svelte OKF Explorer
        working-directory: apps/okf-explorer
        run: pnpm check
      - name: Prove deterministic Svelte OKF Explorer build
        working-directory: apps/okf-explorer
        run: pnpm build:determinism
      - name: Upload exact app build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pages-app-build
          path: apps/okf-explorer/build

  build:
    needs: [impact, adversarial-gate, app]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up locked Python toolchain
        uses: ./.github/actions/setup-locked-python
      - name: Download exact app build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pages-app-build
          path: apps/okf-explorer/build
      - name: Restore reusable content-addressed components
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .site-components
          key: site-components-v3-${{ runner.os }}-${{ github.sha }}
          restore-keys: site-components-v3-${{ runner.os }}-
      - name: Validate Evaluation Foundry fixtures
        if: needs.impact.outputs.foundry == 'true'
        run: uv run --locked python scripts/check_evaluation_foundry.py
      - name: Verify persisted public bases before the ordinary check
        if: needs.impact.outputs.foundry == 'true'
        run: uv run --locked python scripts/retarget_heritage_source_snapshots.py --check
      - name: Validate externalised heritage candidate family
        if: needs.impact.outputs.foundry == 'true'
        env:
          IMPACT_BUILDER_FIXTURES: ${{ needs.impact.outputs.builder_fixtures }}
          IMPACT_BUILDER_PLANES: ${{ needs.impact.outputs.builder_planes }}
        run: >-
          uv run --locked python scripts/check_impacted_heritage_evaluation.py
          --fixtures-json "$IMPACT_BUILDER_FIXTURES"
          --planes-json "$IMPACT_BUILDER_PLANES"
      - name: Validate external publication topology and rooted bytes
        if: needs.impact.outputs.foundry == 'true'
        run: >-
          uv run --locked python scripts/export_publication_unit.py
          --descriptor publication-units/heritage-coventry-warwickshire/publication-unit.json
          --check
      - name: Validate YAML-LD registry and constraint ledger
        run: |
          uv run --locked python scripts/build_okf_registry.py --check
          uv run --locked python scripts/check_source_constraints.py
      - name: Validate OKF bundle and conformance
        run: |
          uv run --locked python scripts/build_okf_bundle.py --check
          uv run --locked python scripts/update_viewer.py --check
          uv run --locked python scripts/check_okf.py
          uv run --locked python scripts/check_legislation_okf.py
      - name: Build componentised static Site
        run: uv run --locked python scripts/build_site.py --candidate-receipt "$RUNNER_TEMP/site-candidate-receipt.json"
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
      - name: Upload pre-deploy candidate identity separately
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pages-site-candidate-receipt
          path: ${{ runner.temp }}/site-candidate-receipt.json

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
