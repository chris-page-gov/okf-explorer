[project]
name = "okf-explorer-tooling"
version = "0.0.0"
description = "Deterministic Python tooling for OKF Explorer"
requires-python = ">=3.12.11,<3.13"
dependencies = [
    "jsonschema>=4.23,<5",
    "markdown-it-py>=4,<5",
    "pillow>=11,<13",
    "python-docx>=1.2,<2",
    "PyLD>=2.0.4,<3",
    "rdflib>=7.1,<8",
    "referencing>=0.37,<0.38",
    "ruamel.yaml>=0.19,<0.20",
    "yaml-ld>=1.1.22,<2",
]

[tool.uv]
package = false
required-version = "==0.12.2"
