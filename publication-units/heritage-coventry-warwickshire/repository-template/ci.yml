name: Validate external exemplar candidate

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.4"
      - name: Synchronise the governed Python environment
        run: |
          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/heritage-publication-venv"
          printf 'UV_PROJECT_ENVIRONMENT=%s\n' "$UV_PROJECT_ENVIRONMENT" >> "$GITHUB_ENV"
          uv python install 3.12.11
          uv sync --locked --project site/toolchain --python 3.12.11
      - name: Validate exact candidate closure
        run: uv run --locked --project site/toolchain python site/scripts/check_publication_unit_manifest.py site
      - name: Reject promotion evidence inside the candidate
        run: |
          test ! -e site/release-assurance/heritage-publication-envelope.json
          test ! -d site/evaluation-foundry/fixtures/heritage-warwickshire/evidence
