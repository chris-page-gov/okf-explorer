name: Validate external exemplar candidate

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r site/requirements-okf.txt
      - name: Validate exact candidate closure
        run: python3 site/scripts/check_publication_unit_manifest.py site
      - name: Reject promotion evidence inside the candidate
        run: |
          test ! -e site/release-assurance/heritage-publication-envelope.json
          test ! -d site/evaluation-foundry/fixtures/heritage-warwickshire/evidence
