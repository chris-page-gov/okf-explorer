name: Publish external exemplar Pages

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/heritage-publication-venv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.4"
      - name: Synchronise the governed Python environment
        run: |
          uv python install 3.12.11
          uv sync --locked --project site/toolchain
      - name: Validate exact rooted publication candidate
        run: uv run --locked --project site/toolchain python site/scripts/check_publication_unit_manifest.py site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
  deploy:
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
