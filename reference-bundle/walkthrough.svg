<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 511" role="img" aria-labelledby="title description"><title id="title">Source trails for the council tool-access question</title><desc id="description">Separate search lanes. Arrows are existing directed concept references, not an assurance or an invented connection between lanes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#0b0c0c"/></marker></defs><g fill="#0b0c0c" font-family="Arial, sans-serif"><text x="20" y="56" font-size="19">Consent and execution evidence</text><rect x="20" y="76" width="210" height="86" rx="4" fill="#f3f2f1" stroke="#505a5f"/><text x="32" y="103" font-size="17">Model Context Protocol</text><text x="32" y="126" font-size="17">(MCP)</text><rect x="260" y="76" width="210" height="86" rx="4" fill="#f3f2f1" stroke="#505a5f"/><text x="272" y="103" font-size="17">Consent</text><path d="M232 119 H255" fill="none" stroke="#0b0c0c" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="76" width="210" height="86" rx="4" fill="#f3f2f1" stroke="#505a5f"/><text x="512" y="103" font-size="17">Observability and</text><text x="512" y="126" font-size="17">provenance</text><path d="M472 119 H495" fill="none" stroke="#0b0c0c" stroke-width="2" marker-end="url(#arrow)"/><rect x="740" y="76" width="210" height="86" rx="4" fill="#f3f2f1" stroke="#505a5f"/><text x="752" y="103" font-size="17">W3C PROV</text><path d="M712 119 H735" fill="none" stroke="#0b0c0c" stroke-width="2" marker-end="url(#arrow)"/><text x="20" y="201" font-size="19">Registry, delegation and discovery</text><rect x="20" y="221" width="210" height="86" rx="4" fill="#f3f2f1" stroke="#505a5f"/><text x="32" y="248" font-size="17">Context Hub</text><rect x="260" y="221" width="210" height="86" rx="4" fill="#f3f2f1" stroke="#505a5f"/><text x="272" y="248" font-size="17">Agent2Agent (A2A)</text><path d="M232 264 H255" fill="none" stroke="#0b0c0c" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="221" width="210" height="86" rx="4" fill="#f3f2f1" stroke="#505a5f"/><text x="512" y="248" font-size="17">Agent Card</text><path d="M472 264 H495" fill="none" stroke="#0b0c0c" stroke-width="2" marker-end="url(#arrow)"/><rect x="740" y="221" width="210" height="86" rx="4" fill="#f3f2f1" stroke="#505a5f"/><text x="752" y="248" font-size="17">Tool discovery</text><path d="M712 264 H735" fill="none" stroke="#0b0c0c" stroke-width="2" marker-end="url(#arrow)"/><text x="20" y="346" font-size="19">Separate security search</text><rect x="20" y="366" width="210" height="86" rx="4" fill="#f3f2f1" stroke="#505a5f"/><text x="32" y="393" font-size="17">NCSC Guidelines for</text><text x="32" y="416" font-size="17">secure AI system</text><text x="32" y="439" font-size="17">development</text><text x="20" y="499" font-size="17">Arrows show derived references. Separate lanes do not imply a graph connection.</text></g></svg>
