    title: Review public producers absent from the semantic bundle registry
    status: open
    priority: P2
    discovered: "2026-08-18"
    repositories:
      - okf-LandRegistry
      - okf-govuk-content
      - okf-uk-living
      - okf-els-api
      - okf-planning
    evidence: []
    notes:
      - Registration follows producer review and does not promote a draft automatically.
  - id: profile-legislation-validator
    title: Profile the UK Legislation validator before dependency-safe sharding
    status: open
    priority: P1
    discovered: "2026-08-18"
    repositories:
      - okf-uk-legislation
    evidence: []
    notes:
      - Documentation-only routing remains fail-closed until timings and dependencies are recorded.
  - id: profile-ons-tests
    title: Profile the ONS test stage before splitting it
    status: open
    priority: P2
    discovered: "2026-08-18"
    repositories:
      - okf-ons
    evidence: []
    notes:
      - Remove the duplicate build first because it is independently evidenced and lower risk.
  - id: workbook-adapter-fixtures
    title: Add safe workbook-folder conformance fixtures and inventories
    status: planned
    priority: P1
    discovered: "2026-08-18"
    repositories:
      - okf-ons
      - wcc-domesday-map-warwickshire-public
    evidence: []
    notes:
      - Cover formulae, cached values, hidden sheets, macros, external links, date systems, locale, rights and sensitivity without executing active content.
  - id: estate-transaction-orchestrator
    title: Orchestrate one repository transaction at a time while running independent repositories concurrently
    status: planned
    priority: P2
    discovered: "2026-08-18"
    repositories:
      - okf-explorer
    evidence: []
    notes:
      - Preserve the reconciler's atomic multi-target preflight while avoiding estate-wide blocking.
  - id: measure-site-component-cache
    title: Measure Explorer Site component cache restore and build costs before changing cache policy
    status: open
    priority: P3
    discovered: "2026-08-18"
    repositories:
      - okf-explorer
    evidence: []
    notes:
      - Recent restore and save cost was material, but a clean build may be substantially slower.
