scope:
  record_definition: >-
    One unique current NHLE ListEntry intersecting at least one pinned scope
    boundary, or one sanctioned annual Heritage at Risk source row whose
    authoritative local-government fields place it in the same scope.
  included:
    - NHLE layers 0, 1, 2, 6, 7, 8, 9 and 10, with duplicate display layers 3, 4 and 5 excluded.
    - Every unique source feature that spatially intersects the exact pinned boundaries, including boundary-crossing features once with every matching geography retained.
    - Sanctioned Historic England annual Heritage at Risk entries, additions and positive removals from 2013 through 2025 when Local Planning Authority, Local Authority, Unitary Authority, District/Borough or Council fields identify the scope; locality-only names are excluded.
    - Source-native fields, source geometry, deterministic normalization, provenance, aliases, relationship assertions and linked official HTML records.
  excluded:
    - Rich-page narrative copied in bulk from Historic England HTML pages.
    - Heritage assets outside the exact pinned boundary intersection.
    - Claims invented to fill absent source fields.
    - Synthetic capability examples from faithful counts, search and default loading.
