<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17202a" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <script>
      (() => {
        const landingFragments = new Set(['', '#start', '#journey', '#subjects', '#bundles', '#people', '#concepts', '#responsible', '#help']);
        const route = location.pathname.split('/').filter(Boolean).at(-1) || '';
        if (route !== 'explore' && location.pathname.endsWith('/') && (location.search || !landingFragments.has(location.hash))) {
          location.replace(`${location.pathname}explore/${location.search}${location.hash}`);
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div>%sveltekit.body%</div>
  </body>
</html>
