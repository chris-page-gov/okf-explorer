<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17202a" />
    <title>Page not found · OKF Explorer</title>
    <link rel="icon" href="/okf-explorer/favicon.svg" />
    <style>
      :root {
        color: #17202a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f7f9;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(36rem, calc(100% - 3rem));
        padding: 2.5rem;
        border: 1px solid #cbd6e2;
        border-radius: 0.75rem;
        background: #fff;
        box-shadow: 0 0.75rem 2.5rem rgb(23 32 42 / 12%);
      }

      .status {
        margin: 0 0 0.5rem;
        color: #4b5d6b;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3.25rem);
      }

      p {
        line-height: 1.6;
      }

      a {
        color: #005ea5;
        font-weight: 700;
      }

      a:focus-visible {
        outline: 3px solid #ffdd00;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="status">404</p>
      <h1>Page not found</h1>
      <p>The requested page is not part of this published OKF Explorer site.</p>
      <p><a href="/okf-explorer/">Return to OKF Explorer</a></p>
    </main>
  </body>
</html>
